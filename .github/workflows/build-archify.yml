name: Build Archify diagram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Demo_Video/source/overview.dataflow.json'
      - '.github/workflows/build-archify.yml'
permissions:
  contents: write
concurrency:
  group: archify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Checkout pinned Archify skill
        uses: actions/checkout@v4
        with:
          repository: tt-a1i/archify
          ref: 72c750bb070d95171dbb2244e5b62b1b7da69c12
          path: .archify-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate typed source
        run: |
          mkdir -p Demo_Video/verification
          set -o pipefail
          node .archify-source/archify/bin/archify.mjs validate dataflow Demo_Video/source/overview.dataflow.json --quality showcase --json | tee Demo_Video/verification/archify-validation.json
      - name: Deliver immutable Archify artifact
        run: |
          set -o pipefail
          node .archify-source/archify/bin/archify.mjs deliver dataflow Demo_Video/source/overview.dataflow.json Demo_Video/archify-flow.html --quality showcase --json | tee Demo_Video/verification/archify-delivery.json
          printf '%s\n' 'Archify source: tt-a1i/archify@72c750bb070d95171dbb2244e5b62b1b7da69c12' > Demo_Video/verification/archify-version.txt
      - name: Commit generated map and receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Demo_Video/archify-flow.html Demo_Video/verification
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated Archify deployment map [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archify-build-evidence
          path: |
            Demo_Video/archify-flow.html
            Demo_Video/verification/
          if-no-files-found: warn
